name: Build check

# Cloudflare Pages runs the real build. This job only checks that every push
# still produces a working site, so a bad edit is caught before it goes live.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the site
        run: python build.py
      - name: Check the expected pages exist
        run: |
          for page in index.html about/index.html governance/index.html \
                      congresses/index.html awards/index.html publications/index.html \
                      news/index.html gallery/index.html membership/index.html \
                      contact/index.html sitemap.xml; do
            test -s "dist/$page" || { echo "missing or empty: dist/$page"; exit 1; }
          done
          echo "all pages built"
