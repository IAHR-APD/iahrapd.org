# Pages CMS — the admin screen for this site.
#
# Editors go to https://app.pagescms.org, sign in with their GitHub account and
# pick this repository. There is nothing to install and no separate account:
# anyone with write access to the repository can edit, and removing their
# access removes their editing rights.
#
# This file describes what the editing screens look like. Adding a field here
# also needs the field adding to build.py.

media:
  - name: uploads
    label: Uploaded images and files
    input: assets/uploads
    output: /assets/uploads
  - name: people
    label: Portraits
    input: assets/people
    output: /assets/people
  - name: gallery
    label: Gallery photographs
    input: assets/gallery
    output: /assets/gallery
  - name: hero
    label: Home page photographs
    input: assets/hero
    output: /assets/hero

content:

  # ---------------------------------------------------------------- news
  - name: news
    label: News
    type: collection
    path: content/news
    format: json
    extension: json
    filename: '{fields.date}-{primary}.json'
    primary: title
    view:
      fields: [date, title]
      sort: [date]
      default:
        sort: date
        order: desc
    fields:
      - { name: date, label: Date, type: date, options: { format: yyyy-MM-dd } }
      - { name: title, label: Title, type: string }
      - { name: summary, label: Summary, type: text, description: "One or two sentences. Shown on the home page and the news list." }
      - { name: image, label: Photograph, type: image, required: false, options: { media: gallery }, description: "Optional. Shown on the news list and at the top of the item." }
      - { name: body, label: Body, type: rich-text, required: false }

  # ---------------------------------------------------------------- gallery
  - name: gallery
    label: Gallery
    label_singular: Year
    type: collection
    path: content/gallery
    format: json
    extension: json
    filename: '{fields.year}-{primary}.json'
    primary: title
    view:
      fields: [year, title, where]
      sort: [year]
      default:
        sort: year
        order: desc
    fields:
      - { name: year, label: Year, type: string }
      - { name: title, label: Event, type: string, description: "e.g. 26th IAHR-APD Congress" }
      - { name: where, label: Dates and place, type: string, description: "e.g. 8 – 11 February 2028 · Wellington, New Zealand" }
      - { name: date, label: Month, type: string, required: false, description: "Only needed if two events share a year. Format YYYY-MM." }
      - name: photos
        label: Photographs
        type: object
        list: true
        fields:
          - { name: image, label: Photograph, type: image, options: { media: gallery }, description: "Any size. The site makes its own small version." }
          - { name: caption, label: Caption, type: string, required: false }
          - { name: thumb, label: Small version, type: image, required: false, options: { media: gallery }, description: "Leave empty. Only for overriding the automatic crop." }

  # ---------------------------------------------------------------- committee
  - name: committee
    label: Executive Committee
    type: file
    path: content/committee.json
    format: json
    fields:
      - { name: term, label: Term, type: string, description: "e.g. 2027 – 2028" }
      - name: officers
        label: Chair and Vice-Chair
        type: object
        list: true
        fields:
          - { name: role, label: Role, type: string }
          - { name: name, label: Name, type: string }
          - { name: affiliation, label: Affiliation, type: string }
          - { name: department, label: Department, type: string, required: false }
          - { name: country, label: Country or economy, type: string }
          - { name: photo, label: Photograph, type: image, options: { media: people } }
      - name: members
        label: Members
        type: object
        list: true
        description: "The order here is the order on the page. Keep the Secretary General last."
        fields:
          - { name: role, label: Role, type: select, options: { values: ["EC Member", "YPN Member", "Co-opted Member", "Secretary General"] } }
          - { name: name, label: Name, type: string }
          - { name: affiliation, label: Affiliation, type: string }
          - { name: country, label: Country or economy, type: string }
          - { name: photo, label: Photograph, type: image, options: { media: people } }
          - { name: flag, label: Needs checking, type: string, required: false, description: "Leave empty. Any text here shows as an orange warning tag next to the affiliation." }
      - { name: past_terms, label: Past terms, type: string, list: true }

  # ---------------------------------------------------------------- congresses
  - name: congresses
    label: Congresses
    type: file
    path: content/congresses.json
    format: json
    fields:
      - name: next
        label: Next congress
        type: object
        fields:
          - { name: number, label: Number, type: string }
          - { name: year, label: Year, type: number }
          - { name: city, label: City, type: string }
          - { name: country, label: Country, type: string }
          - { name: dates, label: Dates, type: string }
          - { name: opening, label: Opening day, type: date, options: { format: yyyy-MM-dd }, description: "Drives the countdown on the home page." }
          - { name: theme, label: Theme, type: string, required: false }
          - { name: host, label: Host, type: string }
          - { name: abstracts, label: Abstracts, type: string }
      - name: latest
        label: Most recent congress
        type: object
        fields:
          - { name: number, label: Number, type: string }
          - { name: year, label: Year, type: number }
          - { name: city, label: City, type: string }
          - { name: country, label: Country, type: string }
          - { name: dates, label: Dates, type: string }
          - { name: venue, label: Venue, type: string }
          - { name: theme, label: Theme, type: string }
      - name: archive
        label: Archive
        type: object
        list: true
        fields:
          - { name: number, label: Number, type: string }
          - { name: year, label: Year, type: string, required: false }
          - { name: location, label: Location, type: string }
          - { name: theme, label: Theme, type: string, required: false }
          - { name: next, label: Mark as the next congress, type: boolean, required: false }
      - name: proceedings
        label: Proceedings
        type: object
        list: true
        fields:
          - { name: number, label: Number, type: string }
          - { name: year, label: Year, type: string }
          - { name: host, label: Host, type: string }
          - { name: url, label: Link, type: string, required: false }

  # ---------------------------------------------------------------- awards
  - name: awards
    label: Awards
    type: file
    path: content/awards.json
    format: json
    fields:
      - name: latest
        label: Most recent congress
        type: object
        fields:
          - { name: congress, label: Congress, type: string }
          - { name: year, label: Year, type: string }
          - name: distinguished
            label: Distinguished Membership
            type: object
            fields:
              - { name: name, label: Name, type: string }
              - { name: affiliation, label: Affiliation, type: string }
              - { name: photo, label: Photograph, type: image, required: false, options: { media: people } }
          - name: heritage
            label: Heritage Award
            type: object
            fields:
              - { name: name, label: Name, type: string }
              - { name: affiliation, label: Place, type: string }
              - { name: image, label: Photograph of the site, type: image, required: false, options: { media: uploads }, description: "Shown wide at the top of the card. A landscape photograph works best." }
              - { name: citation, label: Citation, type: text, required: false }
          - name: papers
            label: Best Paper Award
            type: object
            list: true
            fields:
              - { name: title, label: Title, type: text }
              - { name: authors, label: Authors, type: string }
              - { name: country, label: Country, type: string }
      - name: distinguished
        label: Distinguished Membership — all recipients
        type: object
        fields:
          - { name: eyebrow, label: Label, type: string }
          - { name: title, label: Title, type: string }
          - { name: intro, label: Introduction, type: text }
          - name: recipients
            label: Recipients
            type: object
            list: true
            fields:
              - { name: year, label: Year, type: string }
              - name: people
                label: People
                type: object
                list: true
                fields:
                  - { name: name, label: Name, type: string }
                  - { name: note, label: Affiliation or country, type: string }
      - name: heritage
        label: Heritage Award — all recipients
        type: object
        fields:
          - { name: eyebrow, label: Label, type: string }
          - { name: title, label: Title, type: string }
          - { name: intro, label: Introduction, type: text }
          - name: recipients
            label: Recipients
            type: object
            list: true
            fields:
              - { name: year, label: Year, type: string }
              - name: people
                label: Sites
                type: object
                list: true
                fields:
                  - { name: name, label: Name, type: string }
                  - { name: note, label: Country, type: string }
      - name: best_paper
        label: Best Paper Award — all recipients
        type: object
        fields:
          - { name: eyebrow, label: Label, type: string }
          - { name: title, label: Title, type: string }
          - { name: intro, label: Introduction, type: text }
          - name: recipients
            label: Recipients
            type: object
            list: true
            fields:
              - { name: year, label: Year, type: string }
              - name: people
                label: Papers
                type: object
                list: true
                fields:
                  - { name: name, label: Paper title, type: text }
                  - { name: note, label: Authors, type: string }

  # ---------------------------------------------------------------- documents
  - name: documents
    label: By-Laws, statements and reports
    type: collection
    path: content/documents
    format: json
    extension: json
    filename: '{primary}.json'
    primary: title
    view:
      fields: [title, kind, version]
    fields:
      - { name: title, label: Title, type: string }
      - { name: kind, label: Kind, type: select, options: { values: [statute, report] }, description: "statute = By-Laws and award statements, shown under About. report = annual reports, shown under Governance." }
      - { name: status, label: Status, type: string, required: false, description: "e.g. In force. Leave empty for reports." }
      - { name: version, label: Edition or year, type: string, required: false }
      - { name: order, label: Order, type: number, required: false, description: "Lower numbers appear first in the lists." }
      - { name: summary, label: Summary, type: text, required: false }
      - { name: intro, label: Introduction, type: text, required: false }
      - { name: pdf, label: PDF, type: file, required: false, options: { media: uploads } }
      - name: body
        label: Text
        type: object
        list: true
        fields:
          - { name: type, label: Block, type: select, options: { values: [heading, text, list] } }
          - { name: text, label: Text, type: text, required: false, description: "For heading and text blocks." }
          - { name: items, label: Items, type: string, list: true, required: false, description: "For list blocks." }
      - name: superseded
        label: Earlier editions
        type: object
        list: true
        fields:
          - { name: title, label: Title, type: string }
          - { name: note, label: Note, type: text, required: false }
          - { name: pdf, label: PDF, type: file, required: false, options: { media: uploads } }

  # ---------------------------------------------------------------- hero
  - name: hero
    label: Home page photographs
    type: file
    path: content/hero.json
    format: json
    fields:
      - { name: interval_seconds, label: Seconds between photographs, type: number }
      - name: slides
        label: Photographs
        type: object
        list: true
        fields:
          - { name: image, label: Photograph, type: image, options: { media: hero } }
          - { name: place, label: Place, type: string }
          - { name: region, label: Region, type: string }

  # ---------------------------------------------------------------- downloads
  - name: downloads
    label: Congress hosting pack
    type: file
    path: content/downloads.json
    format: json
    fields:
      - name: congress_pack
        label: Files
        type: object
        list: true
        fields:
          - { name: title, label: Title, type: string }
          - { name: format, label: Format, type: select, options: { values: [PDF, DOCX, XLSX] } }
          - { name: file, label: File, type: file, options: { media: uploads } }

  # ---------------------------------------------------------------- calendar
  - name: events
    label: Calendar
    type: file
    path: content/events.json
    format: json
    fields:
      - name: events
        label: Events
        type: object
        list: true
        fields:
          - { name: month, label: Month, type: string }
          - { name: year, label: Year, type: string }
          - { name: title, label: Title, type: string }
          - { name: detail, label: Dates and place, type: string }

  # ---------------------------------------------------------------- EC meetings
  - name: ec_meetings
    label: Executive Committee meetings
    type: file
    path: content/ec-meetings.json
    format: json
    fields:
      - name: meetings
        label: Meetings
        type: object
        list: true
        fields:
          - { name: date, label: Date, type: string, description: "e.g. 2026·07" }
          - { name: type, label: Type, type: select, options: { values: ["EC meeting", "EC gathering"] } }
          - { name: location, label: Location, type: string }
          - { name: with, label: Held with, type: string }

  # ---------------------------------------------------------------- journal
  - name: journal
    label: Journal (JHER)
    type: file
    path: content/journal.json
    format: json
    fields:
      - { name: title, label: Title, type: string }
      - { name: abbreviation, label: Abbreviation, type: string }
      - { name: eyebrow, label: Label, type: string }
      - { name: body, label: Description, type: text, list: true }
      - { name: metrics_year, label: Metrics year, type: string }
      - name: metrics
        label: Metrics
        type: object
        list: true
        fields:
          - { name: label, label: Label, type: string }
          - { name: value, label: Value, type: string }
      - name: editors
        label: Editors-in-Chief
        type: object
        list: true
        fields:
          - { name: name, label: Name, type: string }
          - { name: affiliation, label: Affiliation, type: string }
          - { name: interests, label: Interests, type: string, required: false }
          - { name: photo, label: Photograph, type: image, options: { media: people } }
      - name: other_publications
        label: Other IAHR publications
        type: object
        list: true
        fields:
          - { name: kind, label: Kind, type: string }
          - { name: title, label: Title, type: string }
          - { name: note, label: Note, type: string }
          - { name: meta, label: Publisher, type: string }

  # ---------------------------------------------------------------- site
  - name: site
    label: Site and Secretariat
    type: file
    path: content/site.json
    format: json
    fields:
      - { name: short_name, label: Short name, type: string }
      - { name: full_name, label: Full name, type: string }
      - { name: tagline, label: Home page headline, type: string }
      - { name: founded, label: Founded, type: number }
      - { name: enquiry_topics, label: What the Secretariat handles, type: string, list: true }
      - { name: custom_domain, label: Custom domain, type: string, required: false, description: "Leave empty until the domain is pointed at GitHub Pages. Then enter www.iahrapd.org and the site switches over." }
      - name: secretariat
        label: Secretariat
        type: object
        fields:
          - { name: host, label: Host institution, type: string }
          - { name: address_lines, label: Address, type: string, list: true }
          - { name: telephone, label: Telephone, type: string }
          - { name: secretary_general, label: Secretary General, type: string }
          - { name: email, label: General enquiry address, type: string, required: false }
          - name: people
            label: Who to write to
            type: object
            list: true
            fields:
              - { name: role, label: Role, type: string }
              - { name: name, label: Name, type: string }
              - { name: affiliation, label: Affiliation, type: string }
              - { name: email, label: Email, type: string, description: "Published on the Contact page. Prefer a shared address over a personal one — it outlives the post-holder." }
              - { name: note, label: Note, type: string, required: false }
      - name: links
        label: External links
        type: object
        fields:
          - { name: iahr_global, label: IAHR global, type: string }
          - { name: iahr_membership, label: IAHR membership, type: string }
          - { name: jher, label: JHER, type: string }
          - { name: kict, label: KICT, type: string }
