# Decap CMS — the admin screen at /admin/
#
# Before this works, fill in `repo` below with the GitHub repository, and
# `base_url` with the address of the small OAuth worker (see cms-auth/README.md).
# Nothing else in this file needs changing to add news or edit pages.

backend:
  name: github
  repo: ORG/iahr-apd-website          # <-- change to your GitHub org/repo
  branch: main
  base_url: https://REPLACE-ME.workers.dev   # <-- change to your OAuth worker

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

publish_mode: simple
locale: en
site_url: https://www.iahrapd.org
logo_url: /assets/logo/iahr-apd.png

collections:

  # ---------------------------------------------------------------- news
  - name: news
    label: News
    label_singular: News item
    folder: content/news
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    extension: json
    format: json
    summary: "{{date}} — {{title}}"
    sortable_fields: [date, title]
    fields:
      - { name: date, label: Date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - { name: title, label: Title, widget: string }
      - { name: summary, label: Summary, widget: text, hint: "One or two sentences. Shown on the home page and the news list." }
      - { name: body, label: Body, widget: markdown, required: false }

  # ---------------------------------------------------------------- gallery
  - name: gallery
    label: Gallery
    files:
      - name: gallery
        label: Photographs by year
        file: content/gallery.json
        fields:
          - name: years
            label: Years
            widget: list
            summary: "{{fields.year}} — {{fields.title}}"
            fields:
              - { name: year, label: Year, widget: string }
              - { name: title, label: Event, widget: string }
              - { name: where, label: Dates and place, widget: string }
              - name: photos
                label: Photographs
                widget: list
                summary: "{{fields.caption}}"
                fields:
                  - { name: image, label: Photograph, widget: image }
                  - { name: thumb, label: Small version, widget: image, required: false, hint: "Leave empty to use the full photograph." }
                  - { name: caption, label: Caption, widget: string, required: false }

  # ---------------------------------------------------------------- committee
  - name: committee
    label: Executive Committee
    files:
      - name: committee
        label: Committee members
        file: content/committee.json
        fields:
          - { name: term, label: Term, widget: string, hint: "e.g. 2025 – 2026" }
          - name: officers
            label: Chair and Vice-Chair
            widget: list
            summary: "{{fields.role}} — {{fields.name}}"
            fields:
              - { name: role, label: Role, widget: string }
              - { name: name, label: Name, widget: string }
              - { name: affiliation, label: Affiliation, widget: string }
              - { name: department, label: Department, widget: string, required: false }
              - { name: country, label: Country or economy, widget: string }
              - { name: photo, label: Photograph, widget: image }
          - name: members
            label: Members
            widget: list
            summary: "{{fields.name}} — {{fields.role}}"
            hint: "Order here is the order on the page. Keep the Secretary General last."
            fields:
              - { name: role, label: Role, widget: select, options: ["EC Member", "YPN Member", "Co-opted Member", "Secretary General"] }
              - { name: name, label: Name, widget: string }
              - { name: affiliation, label: Affiliation, widget: string }
              - { name: country, label: Country or economy, widget: string }
              - { name: photo, label: Photograph, widget: image }
              - { name: flag, label: Needs checking, widget: string, required: false, hint: "Leave empty. Text here shows as a small warning tag." }
          - { name: past_terms, label: Past terms, widget: list, field: { name: term, label: Term, widget: string } }

  # ---------------------------------------------------------------- congresses
  - name: congresses
    label: Congresses
    files:
      - name: congresses
        label: Congresses and proceedings
        file: content/congresses.json
        fields:
          - name: next
            label: Next congress
            widget: object
            fields:
              - { name: number, label: Number, widget: string }
              - { name: year, label: Year, widget: number, value_type: int }
              - { name: city, label: City, widget: string }
              - { name: country, label: Country, widget: string }
              - { name: dates, label: Dates, widget: string }
              - { name: opening, label: Opening day, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD", hint: "Drives the countdown on the home page." }
              - { name: theme, label: Theme, widget: string, required: false }
              - { name: host, label: Host, widget: string }
              - { name: abstracts, label: Abstracts, widget: string }
          - name: latest
            label: Most recent congress
            widget: object
            fields:
              - { name: number, label: Number, widget: string }
              - { name: year, label: Year, widget: number, value_type: int }
              - { name: city, label: City, widget: string }
              - { name: country, label: Country, widget: string }
              - { name: dates, label: Dates, widget: string }
              - { name: venue, label: Venue, widget: string }
              - { name: theme, label: Theme, widget: string }
          - name: archive
            label: Archive
            widget: list
            summary: "{{fields.number}} {{fields.year}} — {{fields.location}}"
            fields:
              - { name: number, label: Number, widget: string }
              - { name: year, label: Year, widget: string, required: false }
              - { name: location, label: Location, widget: string }
              - { name: theme, label: Theme, widget: string, required: false }
              - { name: next, label: Mark as next congress, widget: boolean, required: false, default: false }
          - name: proceedings
            label: Proceedings
            widget: list
            summary: "{{fields.number}} {{fields.year}}"
            fields:
              - { name: number, label: Number, widget: string }
              - { name: year, label: Year, widget: string }
              - { name: host, label: Host, widget: string }
              - { name: url, label: Link, widget: string, required: false }

  # ---------------------------------------------------------------- awards
  - name: awards
    label: Awards
    files:
      - name: awards
        label: Awards and recipients
        file: content/awards.json
        fields:
          - name: latest
            label: Most recent congress
            widget: object
            fields:
              - { name: congress, label: Congress, widget: string }
              - { name: year, label: Year, widget: string }
              - name: distinguished
                label: Distinguished Membership
                widget: object
                fields:
                  - { name: name, label: Name, widget: string }
                  - { name: affiliation, label: Affiliation, widget: string }
                  - { name: photo, label: Photograph, widget: image, required: false }
              - name: heritage
                label: Heritage Award
                widget: object
                fields:
                  - { name: name, label: Name, widget: string }
                  - { name: affiliation, label: Place, widget: string }
                  - { name: photo, label: Photograph, widget: image, required: false }
              - name: papers
                label: Best Paper Award
                widget: list
                summary: "{{fields.title}}"
                fields:
                  - { name: title, label: Title, widget: text }
                  - { name: authors, label: Authors, widget: string }
                  - { name: country, label: Country, widget: string }
          - name: distinguished
            label: Distinguished Membership — all recipients
            widget: object
            fields:
              - { name: eyebrow, label: Label, widget: string }
              - { name: title, label: Title, widget: string }
              - { name: intro, label: Introduction, widget: text }
              - name: recipients
                label: Recipients
                widget: list
                summary: "{{fields.year}}"
                fields:
                  - { name: year, label: Year, widget: string }
                  - name: people
                    label: People
                    widget: list
                    summary: "{{fields.name}}"
                    fields:
                      - { name: name, label: Name, widget: string }
                      - { name: note, label: Affiliation or country, widget: string }
          - name: heritage
            label: Heritage Award — all recipients
            widget: object
            fields:
              - { name: eyebrow, label: Label, widget: string }
              - { name: title, label: Title, widget: string }
              - { name: intro, label: Introduction, widget: text }
              - name: recipients
                label: Recipients
                widget: list
                summary: "{{fields.year}}"
                fields:
                  - { name: year, label: Year, widget: string }
                  - name: people
                    label: Sites
                    widget: list
                    summary: "{{fields.name}}"
                    fields:
                      - { name: name, label: Name, widget: string }
                      - { name: note, label: Country, widget: string }
          - name: best_paper
            label: Best Paper Award — all recipients
            widget: object
            fields:
              - { name: eyebrow, label: Label, widget: string }
              - { name: title, label: Title, widget: string }
              - { name: intro, label: Introduction, widget: text }
              - name: recipients
                label: Recipients
                widget: list
                summary: "{{fields.year}}"
                fields:
                  - { name: year, label: Year, widget: string }
                  - name: people
                    label: Papers
                    widget: list
                    summary: "{{fields.name}}"
                    fields:
                      - { name: name, label: Paper title, widget: text }
                      - { name: note, label: Authors, widget: string }

  # ---------------------------------------------------------------- everything else
  - name: settings
    label: Other pages
    files:
      - name: site
        label: Site and Secretariat
        file: content/site.json
        fields:
          - { name: short_name, label: Short name, widget: string }
          - { name: full_name, label: Full name, widget: string }
          - { name: tagline, label: Home page headline, widget: string }
          - { name: founded, label: Founded, widget: number, value_type: int }
          - name: secretariat
            label: Secretariat
            widget: object
            fields:
              - { name: host, label: Host institution, widget: string }
              - { name: address_lines, label: Address, widget: list, field: { name: line, label: Line, widget: string } }
              - { name: telephone, label: Telephone, widget: string }
              - { name: secretary_general, label: Secretary General, widget: string }
          - name: links
            label: External links
            widget: object
            fields:
              - { name: iahr_global, label: IAHR global, widget: string }
              - { name: iahr_membership, label: IAHR membership, widget: string }
              - { name: jher, label: JHER, widget: string }
              - { name: kict, label: KICT, widget: string }

      - name: events
        label: Calendar
        file: content/events.json
        fields:
          - name: events
            label: Events
            widget: list
            summary: "{{fields.month}} {{fields.year}} — {{fields.title}}"
            fields:
              - { name: month, label: Month, widget: string }
              - { name: year, label: Year, widget: string }
              - { name: title, label: Title, widget: string }
              - { name: detail, label: Dates and place, widget: string }

      - name: documents
        label: Documents
        file: content/documents.json
        fields:
          - name: statutes
            label: Laws, regulations and statements
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { name: title, label: Title, widget: string }
              - { name: format, label: Format, widget: select, options: [PDF, DOCX, XLSX] }
              - { name: file, label: File, widget: file, required: false }
          - name: annual_reports
            label: Annual reports
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { name: title, label: Title, widget: string }
              - { name: file, label: File, widget: file, required: false }

      - name: ec_meetings
        label: Executive Committee meetings
        file: content/ec-meetings.json
        fields:
          - name: meetings
            label: Meetings
            widget: list
            summary: "{{fields.date}} — {{fields.location}}"
            fields:
              - { name: date, label: Date, widget: string, hint: "e.g. 2026·07" }
              - { name: type, label: Type, widget: select, options: ["EC meeting", "EC gathering"] }
              - { name: location, label: Location, widget: string }
              - { name: with, label: Held with, widget: string }

      - name: journal
        label: Journal (JHER)
        file: content/journal.json
        fields:
          - { name: title, label: Title, widget: string }
          - { name: abbreviation, label: Abbreviation, widget: string }
          - { name: eyebrow, label: Label, widget: string }
          - { name: body, label: Description, widget: list, field: { name: paragraph, label: Paragraph, widget: text } }
          - { name: metrics_year, label: Metrics year, widget: string }
          - name: metrics
            label: Metrics
            widget: list
            summary: "{{fields.label}}: {{fields.value}}"
            fields:
              - { name: label, label: Label, widget: string }
              - { name: value, label: Value, widget: string }
          - name: editors
            label: Editors-in-Chief
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { name: name, label: Name, widget: string }
              - { name: affiliation, label: Affiliation, widget: string }
              - { name: interests, label: Interests, widget: string, required: false }
              - { name: photo, label: Photograph, widget: image }
          - name: other_publications
            label: Other IAHR publications
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { name: kind, label: Kind, widget: string }
              - { name: title, label: Title, widget: string }
              - { name: note, label: Note, widget: string }
              - { name: meta, label: Publisher, widget: string }
